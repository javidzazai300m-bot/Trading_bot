name: Trading Signal Bot

on:
  schedule:
    # Läuft automatisch alle 15 Minuten
    - cron: '*/15 * * * *'
  workflow_dispatch: # Erlaubt es dir, den Bot jederzeit manuell in GitHub zu starten

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        run: python main.py
