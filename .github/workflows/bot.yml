name: Automated Trading Signal Bot

on:
  schedule:
    - cron: '0 8,14,20 * * *'  # Läuft 3x täglich automatisch
  workflow_dispatch: # Ermöglicht den manuellen Start über GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run trading bot
        run: python main.py
