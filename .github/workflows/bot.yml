name: Gold M15 Signal Bot

on:
  schedule:
    # Läuft alle 15 Minuten (im UTC-Format)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Erlaubt auch den manuellen Start über die GitHub App

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot ausführen
        run: python main.py
